<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusPOS — Sign In</title>
  <meta name="description" content="Sign in to NexusPOS — a complete point of sale and inventory management system." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="grid-overlay"></div>
    </div>

    <div class="login-card" id="login-card">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="12" fill="url(#brand-grad)"/>
            <path d="M12 26V18l8-6 8 6v8" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
            <rect x="16" y="20" width="8" height="6" rx="1" stroke="#fff" stroke-width="2"/>
            <defs>
              <linearGradient id="brand-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366f1"/>
                <stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">NexusPOS</span>
          <span class="brand-tagline">Universal Point of Sale</span>
        </div>
      </div>

      <div class="card-body">
        <h1 class="card-title">Welcome back</h1>
        <p class="card-sub">Sign in to your workspace</p>

        <div class="alert-box" id="alert-box" style="display:none"></div>

        <form id="login-form" autocomplete="off">
          <div class="field-group">
            <label class="field-label" for="username">Username</label>
            <div class="field-wrap">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
              </span>
              <input class="field-input" type="text" id="username" name="username" placeholder="Enter username" autocomplete="off" required />
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="password">Password</label>
            <div class="field-wrap">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input class="field-input" type="password" id="password" name="password" placeholder="Enter password" autocomplete="off" required />
              <button type="button" class="field-toggle" id="toggle-pw" aria-label="Toggle password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button class="btn-login" type="submit" id="btn-login">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner" style="display:none">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin">
                <circle cx="12" cy="12" r="10" stroke-opacity=".3"/><path d="M12 2a10 10 0 0 1 10 10"/>
              </svg>
            </span>
          </button>
        </form>

        <div class="login-hints">
          <div class="hint-item">
            <span class="hint-badge admin">Admin</span>
            <span>admin / admin123</span>
          </div>
          <div class="hint-item">
            <span class="hint-badge cashier">Cashier</span>
            <span>cashier / cashier123</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Auth check — redirect if already logged in
    const sess = JSON.parse(sessionStorage.getItem('pos_session') || 'null');
    if (sess && sess.role) {
      window.location.replace(sess.role === 'admin' ? 'index.html' : 'pos.html');
    }

    // Toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    // Login form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const alertBox = document.getElementById('alert-box');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      btn.querySelector('.btn-text').style.display = 'none';
      btn.querySelector('.btn-spinner').style.display = 'inline-flex';
      btn.disabled = true;
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          sessionStorage.setItem('pos_session', JSON.stringify({ username: data.username, role: data.role, full_name: data.full_name }));
          document.getElementById('login-card').classList.add('success');
          setTimeout(() => {
            window.location.href = data.role === 'admin' ? 'index.html' : 'pos.html';
          }, 600);
        } else {
          alertBox.textContent = data.error || 'Invalid credentials';
          alertBox.style.display = 'block';
          document.getElementById('login-card').classList.add('shake');
          setTimeout(() => document.getElementById('login-card').classList.remove('shake'), 600);
        }
      } catch (err) {
        alertBox.textContent = 'Connection error — is the server running?';
        alertBox.style.display = 'block';
      } finally {
        btn.querySelector('.btn-text').style.display = '';
        btn.querySelector('.btn-spinner').style.display = 'none';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
