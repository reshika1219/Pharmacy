<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusPOS — Point of Sale</title>
  <meta name="description" content="NexusPOS — fast point of sale terminal for cashiers." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="pos.css" />
  <script>
    const s = JSON.parse(sessionStorage.getItem('pos_session') || 'null');
    if (!s) window.location.replace('login.html');
  </script>
</head>
<body>
  <div class="pos-shell">

    <!-- ═══ Header ═══ -->
    <header class="pos-header">
      <div class="pos-brand">
        <div class="pos-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <span class="pos-brand-name">NexusPOS</span>
      </div>

      <div class="pos-header-center">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" id="pos-search" placeholder="Search product or scan barcode…" autocomplete="off" />
        </div>
      </div>

      <div class="pos-header-right">
        <div class="pos-clock" id="pos-clock">00:00:00</div>
        <div class="pos-user-pill">
          <div class="pos-user-avatar" id="pos-user-avatar">C</div>
          <div>
            <div class="pos-user-name" id="pos-user-name">Cashier</div>
            <div class="pos-user-role" id="pos-user-role">Cashier</div>
          </div>
        </div>
        <button class="pos-btn-icon" id="btn-logout" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
        <button class="pos-btn-icon" id="btn-admin" title="Admin Panel" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- ═══ Body ═══ -->
    <div class="pos-body">

      <!-- LEFT: Categories + Products -->
      <div class="pos-products-area">
        <!-- Category Tabs -->
        <div class="pos-cats" id="pos-cats">
          <button class="pos-cat-btn active" data-cat="">All</button>
        </div>
        <!-- Product Grid -->
        <div class="pos-grid" id="pos-grid">
          <div class="pos-loading">
            <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity=".3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
            Loading products…
          </div>
        </div>
      </div>

      <!-- RIGHT: Cart & Checkout -->
      <div class="pos-cart-area">

        <!-- Cart Header -->
        <div class="cart-header">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <h2 style="font-size:1rem;font-weight:700;">Current Order</h2>
            <button class="cart-clear-btn" onclick="clearCart()" id="cart-clear">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              Clear
            </button>
          </div>
          <!-- Customer -->
          <div style="position:relative;">
            <select class="pos-select" id="cart-customer">
              <option value="">Walk-in Customer</option>
            </select>
          </div>
        </div>

        <!-- Cart Items -->
        <div class="cart-items" id="cart-items">
          <div class="cart-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="40" height="40"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <p>Cart is empty</p>
            <span>Tap a product to add</span>
          </div>
        </div>

        <!-- Discount & Totals -->
        <div class="cart-totals">
          <div class="discount-row">
            <label class="discount-label">Discount</label>
            <div class="discount-input-wrap">
              <span class="discount-symbol" id="discount-symbol">$</span>
              <input type="number" class="discount-input" id="cart-discount" value="0" min="0" step="0.01" />
            </div>
          </div>
          <div id="totals-lines"></div>
          <div class="total-row">
            <span>Total</span>
            <span id="cart-total">$0.00</span>
          </div>
        </div>

        <!-- Payment Buttons -->
        <div class="cart-actions">
          <div class="pay-methods">
            <button class="pay-btn" id="pay-cash" onclick="checkout('Cash')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
              Cash
            </button>
            <button class="pay-btn" id="pay-card" onclick="checkout('Card')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
              Card
            </button>
            <button class="pay-btn" id="pay-online" onclick="checkout('Online')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              Online
            </button>
          </div>
          <button class="charge-btn" id="charge-btn" onclick="checkout('Cash')">
            Charge <span id="charge-amount">$0.00</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Receipt Modal ═══ -->
  <div class="receipt-overlay" id="receipt-overlay">
    <div class="receipt-modal">
      <div class="receipt-paper" id="receipt-paper"></div>
      <div class="receipt-actions">
        <button class="receipt-btn-close" onclick="closeReceipt()">New Sale</button>
        <button class="receipt-btn-print" onclick="printReceipt()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print
        </button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="pos.js"></script>
</body>
</html>
